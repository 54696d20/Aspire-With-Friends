global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # .NET Services (using HTTPS)
  - job_name: 'masterdataservice'
    static_configs:
      - targets: ['host.docker.internal:7408']
    metrics_path: '/metrics'
    scheme: https
    tls_config:
      insecure_skip_verify: true
    scrape_interval: 10s

  - job_name: 'weatherapi'
    static_configs:
      - targets: ['host.docker.internal:7122']
    metrics_path: '/metrics'
    scheme: https
    tls_config:
      insecure_skip_verify: true
    scrape_interval: 10s

  - job_name: 'gateway'
    static_configs:
      - targets: ['host.docker.internal:7125']
    metrics_path: '/metrics'
    scheme: https
    tls_config:
      insecure_skip_verify: true
    scrape_interval: 10s

  - job_name: 'notificationhubservice'
    static_configs:
      - targets: ['host.docker.internal:7129']
    metrics_path: '/metrics'
    scheme: https
    tls_config:
      insecure_skip_verify: true
    scrape_interval: 10s

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 10s

  # RabbitMQ
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
    scrape_interval: 10s

 