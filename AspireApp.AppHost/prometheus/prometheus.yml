global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # .NET Services (using host.docker.internal to reach host from container)
  - job_name: 'masterdataservice'
    static_configs:
      - targets: ['host.docker.internal:5316']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'weatherapi'
    static_configs:
      - targets: ['host.docker.internal:5062']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'gateway'
    static_configs:
      - targets: ['host.docker.internal:5211']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'notificationhubservice'
    static_configs:
      - targets: ['host.docker.internal:5275']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['localhost:6379']
    scrape_interval: 10s

  # RabbitMQ
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['localhost:15692']
    scrape_interval: 10s 